{
  "name": "BGZONA RS4H isolated infrastructure smoke",
  "on": {
    "push": {
      "branches": [
        "rs4h-isolated-smoke-20261113"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "smoke": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Checkout exact smoke commit",
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Real B runtime synthetic integration",
          "shell": "bash",
          "run": "python3 -m venv \"$RUNNER_TEMP/rs4i-venv\"\n\"$RUNNER_TEMP/rs4i-venv/bin/python\" -m pip --isolated --disable-pip-version-check install --index-url https://pypi.org/simple --only-binary=:all: --no-deps --retries 0 --timeout 30 Pillow==13.0.0\n\"$RUNNER_TEMP/rs4i-venv/bin/python\" -B tools/rs4i/integration.py --report \"$RUNNER_TEMP/rs4i-report/report.json\"\n"
        },
        {
          "name": "Upload synthetic integration report",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "rs4i-runtime-report",
            "path": "${{ runner.temp }}/rs4i-report/report.json",
            "if-no-files-found": "error",
            "retention-days": 7,
            "overwrite": false
          }
        }
      ]
    }
  }
}
