{
  "name": "BGZONA RS4H isolated infrastructure smoke",
  "on": {
    "push": {
      "branches": [
        "rs4h-isolated-smoke-20261113"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "smoke": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Verify isolated Linux infrastructure",
          "shell": "bash",
          "run": "python3 - <<'RS4H_PY'\n\"\"\"Isolated infrastructure checks; only public synthetic results leave RUNNER_TEMP.\"\"\"\nimport fcntl, hashlib, json, os, platform, re, subprocess, sys, urllib.request, venv\nfrom pathlib import Path\n\nroot = Path(os.environ['RUNNER_TEMP']) / 'bgzona-rs4h-smoke'\nroot.mkdir(exist_ok=False)\nreport_path = root / 'report.json'\nreport = {'schema': 'bgzona-rs4h-smoke-v1', 'identity': {\n    'repository': os.environ.get('GITHUB_REPOSITORY'),\n    'branch': os.environ.get('GITHUB_REF_NAME'),\n    'commit': os.environ.get('GITHUB_SHA')},\n    'runner_os': platform.system(), 'versions': {}, 'checks': {}}\n\ndef save():\n    report_path.write_text(json.dumps(report, sort_keys=True, indent=2) + '\\n', encoding='utf-8')\n\ndef require(ok):\n    if not ok:\n        raise ValueError('CHECK_FAILED')\n\ndef check(name, fn):\n    try:\n        result = fn()\n        report['checks'][name] = {'status': 'PASS', **(result or {})}\n    except Exception as error:\n        report['checks'][name] = {'status': 'FAIL', 'error_type': type(error).__name__}\n    save()\n    print(name + ': ' + report['checks'][name]['status'], flush=True)\n\ndef identity():\n    require(report['identity']['repository'] == 'malin-bg/bgzona-github-lab')\n    require(report['identity']['branch'] == 'rs4h-isolated-smoke-20261113')\n    require(os.environ.get('GITHUB_REF') == 'refs/heads/rs4h-isolated-smoke-20261113')\n    require(os.environ.get('GITHUB_EVENT_NAME') == 'push' and os.environ.get('GITHUB_RUN_ATTEMPT') == '1')\n    require(re.fullmatch('[0-9a-f]{40}', report['identity']['commit'] or '') is not None)\n\ncheck('identity', identity)\nif report['checks']['identity']['status'] != 'PASS':\n    raise SystemExit(1)\n\n# No credentials, inherited Git settings, or tracing enter child Git processes.\nclean_env = {'PATH': os.environ['PATH'], 'HOME': str(root), 'LANG': 'C.UTF-8',\n             'LC_ALL': 'C.UTF-8', 'GIT_CONFIG_NOSYSTEM': '1',\n             'GIT_CONFIG_GLOBAL': '/dev/null', 'GIT_CONFIG_SYSTEM': '/dev/null',\n             'GIT_TERMINAL_PROMPT': '0', 'GCM_INTERACTIVE': 'Never'}\n\ndef run(args, timeout=45):\n    return subprocess.run(args, env=clean_env, cwd=root, capture_output=True, text=True,\n                          check=True, timeout=timeout).stdout.strip()\n\ndef versions():\n    require(platform.system() == 'Linux' and sys.version_info >= (3, 12))\n    os_release = dict(line.split('=', 1) for line in Path('/etc/os-release').read_text().splitlines()\n                      if '=' in line)\n    report['versions'].update(ubuntu=os_release['VERSION_ID'].strip('\"'),\n        python=platform.python_version(), git=run(['git', '--version']),\n        openssl=run(['openssl', 'version']))\n    require(os_release['ID'].strip('\"') == 'ubuntu' and report['versions']['ubuntu'] == '24.04')\n\ndef files():\n    data = b'BGZONA RS4H synthetic file I/O\\n'\n    initial = root / 'synthetic.tmp'; final = root / 'synthetic.txt'\n    with initial.open('xb') as handle:\n        handle.write(data); handle.flush(); os.fsync(handle.fileno())\n    initial.replace(final)\n    require(not initial.exists() and final.read_bytes() == data)\n    return {'synthetic_sha256': hashlib.sha256(final.read_bytes()).hexdigest()}\n\nLOCK_CHILD = '''import fcntl,sys\nwith open(sys.argv[1], 'a+b') as handle:\n try:\n  fcntl.flock(handle, fcntl.LOCK_EX | fcntl.LOCK_NB)\n except BlockingIOError:\n  print('BLOCKED')\n else:\n  print('ACQUIRED')\n'''\ndef locking():\n    path = root / 'synthetic.lock'\n    with path.open('a+b') as handle:\n        fcntl.flock(handle, fcntl.LOCK_EX | fcntl.LOCK_NB)\n        require(run([sys.executable, '-c', LOCK_CHILD, str(path)]) == 'BLOCKED')\n        fcntl.flock(handle, fcntl.LOCK_UN)\n    require(run([sys.executable, '-c', LOCK_CHILD, str(path)]) == 'ACQUIRED')\n    return {'separate_process_contended': True, 'released_lock_acquired': True}\n\ndef https_git():\n    result = run(['git', '-c', 'credential.helper=', '-c', 'http.sslVerify=true',\n        '-c', 'http.followRedirects=false', '-c', 'protocol.allow=never',\n        '-c', 'protocol.https.allow=always', 'ls-remote', '--exit-code', '--refs',\n        'https://github.com/malin-bg/bgzona-github-lab.git', 'refs/heads/main'])\n    require(result == 'a3baddce0b63416e62b0dfc0b1b74d21093a5cbd\\trefs/heads/main')\n    return {'TLS_verification': True, 'authenticated': False, 'operation': 'ls-remote'}\n\nPILLOW_CHILD = '''import hashlib,io,json,sys\nfrom pathlib import Path\nimport PIL\nfrom PIL import Image,ImageCms,features\nassert PIL.__version__ == '13.0.0'\nassert Path(PIL.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())\nassert features.check('littlecms2')\nimage=Image.new('RGB',(3,2),(23,117,201))\nprofile=ImageCms.createProfile('sRGB')\nconverted=ImageCms.profileToProfile(image,profile,profile,outputMode='RGB')\nassert converted.size == (3,2) and converted.mode == 'RGB'\nassert converted.tobytes() == image.tobytes()\nencoded=io.BytesIO();converted.save(encoded,format='PNG')\nreopened=Image.open(io.BytesIO(encoded.getvalue()));reopened.load()\nassert reopened.tobytes()==converted.tobytes()\nprint(json.dumps({'pillow':PIL.__version__,'littlecms':features.version('littlecms2'),\n 'isolated_import':True,'synthetic_png_sha256':hashlib.sha256(encoded.getvalue()).hexdigest()}))\n'''\ndef pillow():\n    destination = root / 'venv'; wheels = root / 'wheel'; wheels.mkdir()\n    venv.EnvBuilder(with_pip=True).create(destination)\n    executable = str(destination / 'bin' / 'python')\n    run([executable, '-m', 'pip', '--isolated', '--disable-pip-version-check',\n         'download', '--index-url', 'https://pypi.org/simple', '--only-binary=:all:',\n         '--no-deps', '--retries', '0', '--timeout', '30', '--dest', str(wheels),\n         'Pillow==13.0.0'], timeout=120)\n    candidates = list(wheels.iterdir())\n    require(len(candidates) == 1 and candidates[0].suffix == '.whl')\n    wheel = candidates[0]; digest = hashlib.sha256(wheel.read_bytes()).hexdigest()\n    request = urllib.request.Request('https://pypi.org/pypi/Pillow/13.0.0/json',\n                                     headers={'User-Agent': 'BGZONA-RS4H-infrastructure-smoke/1.0'})\n    with urllib.request.urlopen(request, timeout=30) as response:\n        require(response.status == 200)\n        metadata = json.load(response)\n    matches = [item for item in metadata['urls'] if item['filename'] == wheel.name]\n    require(len(matches) == 1 and not matches[0]['yanked'] and\n            matches[0]['packagetype'] == 'bdist_wheel' and matches[0]['digests']['sha256'] == digest)\n    run([executable, '-m', 'pip', '--isolated', '--disable-pip-version-check',\n         'install', '--no-index', '--no-deps', str(wheel)], timeout=60)\n    result = json.loads(run([executable, '-I', '-c', PILLOW_CHILD]))\n    report['versions'].update(pillow=result.pop('pillow'), littlecms=result.pop('littlecms'))\n    return {**result, 'wheel_filename': wheel.name, 'wheel_sha256': digest, 'official_PyPI_digest_matched': True}\n\nfor name, operation in [('linux_versions', versions), ('file_io', files),\n                         ('fcntl', locking), ('github_https', https_git), ('pillow_imagecms', pillow)]:\n    check(name, operation)\nreport['result'] = 'PASS' if all(item['status'] == 'PASS' for item in report['checks'].values()) else 'FAIL'\nsave()\nraise SystemExit(0 if report['result'] == 'PASS' else 1)\n\nRS4H_PY\n"
        },
        {
          "name": "Upload synthetic report",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "rs4h-smoke-report",
            "path": "${{ runner.temp }}/bgzona-rs4h-smoke/report.json",
            "if-no-files-found": "error",
            "retention-days": 7,
            "overwrite": false
          }
        }
      ]
    }
  }
}
