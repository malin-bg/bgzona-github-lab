{
  "name": "BGZONA D4B4 job-token boundary",
  "on": {
    "push": {
      "branches": [
        "lab/d4b4-token-control"
      ]
    }
  },
  "permissions": {},
  "jobs": {
    "read_only": {
      "name": "A - read-only permission denial",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "permissions": {
        "contents": "read"
      },
      "outputs": {
        "denial_verified": "${{ steps.probe.outputs.denial_verified }}"
      },
      "steps": [
        {
          "env": {
            "PROBE_MODE": "read",
            "JOB_TOKEN": "${{ github.token }}"
          },
          "run": "python3 - <<'PY'\nimport base64, hashlib, json, os, pathlib, re, subprocess, tempfile, urllib.request\n\nREMOTE = \"https://github.com/malin-bg/bgzona-github-lab.git\"\nAPI = \"https://api.github.com/repos/malin-bg/bgzona-github-lab\"\nLEDGER = \"refs/heads/lab/d4b4-token-ledger\"\nCONTROL = \"refs/heads/lab/d4b4-token-control\"\nBASE = \"e7828734b9fc36e0320737bf282d57f6c71cb713\"\nCANDIDATE = \"43a1da60bc204252d21061cd23020427b4e1c030\"\nRECORD = b'{\"schema\":1,\"purpose\":\"BGZONA-004D4B4 synthetic append\",\"index\":1,\"previous\":null}\\n'\nMODE = os.environ[\"PROBE_MODE\"]\nassert MODE in (\"read\", \"write\")\nassert os.environ[\"GITHUB_REPOSITORY\"] == \"malin-bg/bgzona-github-lab\"\nassert os.environ[\"GITHUB_REPOSITORY_ID\"] == \"1426765395\"\nassert os.environ[\"GITHUB_REF\"] == CONTROL\nassert os.environ[\"GITHUB_EVENT_NAME\"] == \"push\"\nassert os.environ[\"GITHUB_RUN_ATTEMPT\"] == \"1\", \"STOP: reruns are prohibited\"\nexpected = {\n    \"refs/heads/main\": \"89f840b035beeec8889a66f784175ae9106d74d2\",\n    \"refs/bgzona/witness\": \"5771a22b759702ccb6d05e8952a683fd309d20b0\",\n    \"refs/heads/lab/protected-ledger-probe\": \"89f840b035beeec8889a66f784175ae9106d74d2\",\n    \"refs/heads/lab/ledger-ff-probe\": \"ae2f3294d145845eb0a37253aacc199bed6843a4\",\n    CONTROL: os.environ[\"GITHUB_SHA\"], LEDGER: BASE,\n}\nroot = pathlib.Path(tempfile.mkdtemp(prefix=\"bgzona-d4b4-\", dir=os.environ[\"RUNNER_TEMP\"]))\n(root / \"empty-gitconfig\").write_bytes(b\"\")\nenv = {k: v for k, v in os.environ.items() if not k.startswith((\"GIT_\", \"GCM_\")) and k != \"JOB_TOKEN\"}\nenv.update({\"GIT_CONFIG_NOSYSTEM\": \"1\", \"GIT_CONFIG_GLOBAL\": str(root / \"empty-gitconfig\"),\n    \"GIT_TERMINAL_PROMPT\": \"0\", \"GIT_AUTHOR_DATE\": \"2026-10-20T00:00:00+00:00\",\n    \"GIT_COMMITTER_DATE\": \"2026-10-20T00:00:00+00:00\", \"GIT_CONFIG_COUNT\": \"2\",\n    \"GIT_CONFIG_KEY_0\": \"http.https://github.com/.extraheader\",\n    \"GIT_CONFIG_VALUE_0\": \"AUTHORIZATION: basic \" + base64.b64encode((\"x-access-token:\" + os.environ[\"JOB_TOKEN\"]).encode()).decode(),\n    \"GIT_CONFIG_KEY_1\": \"credential.helper\", \"GIT_CONFIG_VALUE_1\": \"\"})\ncommon = [\"git\", \"-c\", \"user.name=BGZONA Synthetic Lab\", \"-c\", \"user.email=bgzona-lab@example.invalid\",\n          \"-c\", \"commit.gpgsign=false\", \"-c\", \"core.hooksPath=\" + str(root / \"no-hooks\")]\ndef git(*args, data=None, check=True):\n    p = subprocess.run(common + list(args), cwd=root, env=env, input=data, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=60)\n    if check and p.returncode:\n        raise RuntimeError(\"STOP: git \" + args[0] + \" failed: \" + p.stderr.decode(errors=\"replace\"))\n    return p\ndef text(*args, **kwargs):\n    return git(*args, **kwargs).stdout.decode().strip()\ndef api(suffix):\n    req = urllib.request.Request(API + suffix, headers={\"Accept\": \"application/vnd.github+json\", \"User-Agent\": \"BGZONA-D4B4\"})\n    with urllib.request.urlopen(req, timeout=30) as response:\n        return json.load(response)\ndef refs():\n    result = {}\n    for line in text(\"ls-remote\", \"--refs\", REMOTE).splitlines():\n        oid, ref = line.split()\n        assert re.fullmatch(r\"[0-9a-f]{40}\", oid)\n        result[ref] = oid\n    return result\nmetadata = api(\"\")\nassert metadata[\"id\"] == 1426765395 and metadata[\"owner\"][\"id\"] == 252877943 and metadata[\"full_name\"] == \"malin-bg/bgzona-github-lab\" and metadata[\"visibility\"] == \"public\"\nassert api(\"/rules/branches/lab%2Fd4b4-token-ledger\") == [], \"STOP: unexpected branch policy\"\nbefore = refs()\nassert before == expected, \"STOP: remote refs changed before attempt\"\ngit(\"init\", \"--bare\", \"--object-format=sha1\", \"--initial-branch=main\", str(root / \"objects.git\"))\ndef obj(*args, **kwargs):\n    return git(\"-C\", str(root / \"objects.git\"), *args, **kwargs)\ndef ot(*args, **kwargs):\n    return obj(*args, **kwargs).stdout.decode().strip()\nobj(\"fetch\", \"--no-tags\", REMOTE, LEDGER + \":refs/probe/base\")\nassert ot(\"rev-parse\", \"refs/probe/base\") == BASE\nblob = ot(\"hash-object\", \"-w\", \"--stdin\", data=RECORD)\nobj(\"read-tree\", BASE)\nobj(\"update-index\", \"--add\", \"--cacheinfo\", \"100644,\" + blob + \",ledger/00000001.json\")\ntree = ot(\"write-tree\")\ncandidate = ot(\"commit-tree\", tree, \"-p\", BASE, \"-m\", \"D4B4 synthetic ledger append record 1\")\nassert candidate == CANDIDATE, \"STOP: reconstructed candidate mismatch\"\nassert ot(\"rev-parse\", candidate + \"^\") == before[LEDGER]\nobj(\"merge-base\", \"--is-ancestor\", BASE, candidate)\nassert ot(\"diff-tree\", \"--no-commit-id\", \"--name-status\", \"-r\", BASE, candidate) == \"A\\tledger/00000001.json\"\nassert obj(\"show\", candidate + \":ledger/00000001.json\").stdout == RECORD\nassert refs() == before, \"STOP: remote changed immediately before push\"\ncommand = \"git push --porcelain \" + REMOTE + \" \" + candidate + \":\" + LEDGER\nprint(\"SANITIZED_COMMAND \" + command, flush=True)\npush = obj(\"push\", \"--porcelain\", REMOTE, candidate + \":\" + LEDGER, check=False)\nstdout, stderr = push.stdout.decode(errors=\"replace\"), push.stderr.decode(errors=\"replace\")\nprint(\"PUSH_EXIT \" + str(push.returncode), flush=True)\nprint(\"SERVER_STDOUT \" + stdout, flush=True)\nprint(\"SERVER_STDERR \" + stderr, flush=True)\nafter = refs()\nresult = {\"mode\": MODE, \"before\": before[LEDGER], \"candidate\": candidate, \"after\": after[LEDGER],\n    \"push_exit\": push.returncode, \"parent\": BASE, \"record_bytes\": len(RECORD), \"record_sha256\": hashlib.sha256(RECORD).hexdigest()}\nif MODE == \"read\":\n    assert push.returncode != 0, \"STOP: read-only push unexpectedly succeeded; write job must not run\"\n    assert after == before, \"STOP: unexpected remote change after denial\"\n    assert \"Write access to repository not granted\" in stderr and \"403\" in stderr, \"STOP: not the expected permission-based denial\"\n    assert not any(marker in stderr for marker in (\"GH013\", \"GH006\", \"protected branch\", \"Authentication failed\", \"401\")), \"STOP: unrelated rejection\"\n    result[\"permission_denial_verified\"] = True\n    print(\"D4B4_RESULT \" + json.dumps(result, sort_keys=True), flush=True)\n    with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"utf-8\") as output:\n        output.write(\"denial_verified=true\\n\")\nelse:\n    assert push.returncode == 0, \"STOP: write push rejected; no retry\"\n    expected[LEDGER] = candidate\n    assert after == expected, \"STOP: unexpected post-write refs\"\n    obj(\"fetch\", \"--no-tags\", REMOTE, LEDGER + \":refs/probe/observed\")\n    assert ot(\"rev-parse\", \"refs/probe/observed\") == candidate\n    obj(\"merge-base\", \"--is-ancestor\", BASE, \"refs/probe/observed\")\n    observed = obj(\"show\", \"refs/probe/observed:ledger/00000001.json\").stdout\n    assert observed == RECORD, \"STOP: exact remote record mismatch\"\n    result.update({\"direct_parent_verified\": True, \"remote_ancestry_verified\": True, \"remote_bytes_verified\": True, \"preserved_refs_verified\": True})\n    print(\"D4B4_RESULT \" + json.dumps(result, sort_keys=True), flush=True)\nPY\n",
          "name": "One read-token FF attempt and exact denial verification",
          "id": "probe",
          "shell": "bash"
        }
      ]
    },
    "trusted_write": {
      "name": "B - trusted write FF",
      "needs": "read_only",
      "if": "needs.read_only.result == 'success' && needs.read_only.outputs.denial_verified == 'true'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "permissions": {
        "contents": "write"
      },
      "steps": [
        {
          "env": {
            "PROBE_MODE": "write",
            "JOB_TOKEN": "${{ github.token }}"
          },
          "run": "python3 - <<'PY'\nimport base64, hashlib, json, os, pathlib, re, subprocess, tempfile, urllib.request\n\nREMOTE = \"https://github.com/malin-bg/bgzona-github-lab.git\"\nAPI = \"https://api.github.com/repos/malin-bg/bgzona-github-lab\"\nLEDGER = \"refs/heads/lab/d4b4-token-ledger\"\nCONTROL = \"refs/heads/lab/d4b4-token-control\"\nBASE = \"e7828734b9fc36e0320737bf282d57f6c71cb713\"\nCANDIDATE = \"43a1da60bc204252d21061cd23020427b4e1c030\"\nRECORD = b'{\"schema\":1,\"purpose\":\"BGZONA-004D4B4 synthetic append\",\"index\":1,\"previous\":null}\\n'\nMODE = os.environ[\"PROBE_MODE\"]\nassert MODE in (\"read\", \"write\")\nassert os.environ[\"GITHUB_REPOSITORY\"] == \"malin-bg/bgzona-github-lab\"\nassert os.environ[\"GITHUB_REPOSITORY_ID\"] == \"1426765395\"\nassert os.environ[\"GITHUB_REF\"] == CONTROL\nassert os.environ[\"GITHUB_EVENT_NAME\"] == \"push\"\nassert os.environ[\"GITHUB_RUN_ATTEMPT\"] == \"1\", \"STOP: reruns are prohibited\"\nexpected = {\n    \"refs/heads/main\": \"89f840b035beeec8889a66f784175ae9106d74d2\",\n    \"refs/bgzona/witness\": \"5771a22b759702ccb6d05e8952a683fd309d20b0\",\n    \"refs/heads/lab/protected-ledger-probe\": \"89f840b035beeec8889a66f784175ae9106d74d2\",\n    \"refs/heads/lab/ledger-ff-probe\": \"ae2f3294d145845eb0a37253aacc199bed6843a4\",\n    CONTROL: os.environ[\"GITHUB_SHA\"], LEDGER: BASE,\n}\nroot = pathlib.Path(tempfile.mkdtemp(prefix=\"bgzona-d4b4-\", dir=os.environ[\"RUNNER_TEMP\"]))\n(root / \"empty-gitconfig\").write_bytes(b\"\")\nenv = {k: v for k, v in os.environ.items() if not k.startswith((\"GIT_\", \"GCM_\")) and k != \"JOB_TOKEN\"}\nenv.update({\"GIT_CONFIG_NOSYSTEM\": \"1\", \"GIT_CONFIG_GLOBAL\": str(root / \"empty-gitconfig\"),\n    \"GIT_TERMINAL_PROMPT\": \"0\", \"GIT_AUTHOR_DATE\": \"2026-10-20T00:00:00+00:00\",\n    \"GIT_COMMITTER_DATE\": \"2026-10-20T00:00:00+00:00\", \"GIT_CONFIG_COUNT\": \"2\",\n    \"GIT_CONFIG_KEY_0\": \"http.https://github.com/.extraheader\",\n    \"GIT_CONFIG_VALUE_0\": \"AUTHORIZATION: basic \" + base64.b64encode((\"x-access-token:\" + os.environ[\"JOB_TOKEN\"]).encode()).decode(),\n    \"GIT_CONFIG_KEY_1\": \"credential.helper\", \"GIT_CONFIG_VALUE_1\": \"\"})\ncommon = [\"git\", \"-c\", \"user.name=BGZONA Synthetic Lab\", \"-c\", \"user.email=bgzona-lab@example.invalid\",\n          \"-c\", \"commit.gpgsign=false\", \"-c\", \"core.hooksPath=\" + str(root / \"no-hooks\")]\ndef git(*args, data=None, check=True):\n    p = subprocess.run(common + list(args), cwd=root, env=env, input=data, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=60)\n    if check and p.returncode:\n        raise RuntimeError(\"STOP: git \" + args[0] + \" failed: \" + p.stderr.decode(errors=\"replace\"))\n    return p\ndef text(*args, **kwargs):\n    return git(*args, **kwargs).stdout.decode().strip()\ndef api(suffix):\n    req = urllib.request.Request(API + suffix, headers={\"Accept\": \"application/vnd.github+json\", \"User-Agent\": \"BGZONA-D4B4\"})\n    with urllib.request.urlopen(req, timeout=30) as response:\n        return json.load(response)\ndef refs():\n    result = {}\n    for line in text(\"ls-remote\", \"--refs\", REMOTE).splitlines():\n        oid, ref = line.split()\n        assert re.fullmatch(r\"[0-9a-f]{40}\", oid)\n        result[ref] = oid\n    return result\nmetadata = api(\"\")\nassert metadata[\"id\"] == 1426765395 and metadata[\"owner\"][\"id\"] == 252877943 and metadata[\"full_name\"] == \"malin-bg/bgzona-github-lab\" and metadata[\"visibility\"] == \"public\"\nassert api(\"/rules/branches/lab%2Fd4b4-token-ledger\") == [], \"STOP: unexpected branch policy\"\nbefore = refs()\nassert before == expected, \"STOP: remote refs changed before attempt\"\ngit(\"init\", \"--bare\", \"--object-format=sha1\", \"--initial-branch=main\", str(root / \"objects.git\"))\ndef obj(*args, **kwargs):\n    return git(\"-C\", str(root / \"objects.git\"), *args, **kwargs)\ndef ot(*args, **kwargs):\n    return obj(*args, **kwargs).stdout.decode().strip()\nobj(\"fetch\", \"--no-tags\", REMOTE, LEDGER + \":refs/probe/base\")\nassert ot(\"rev-parse\", \"refs/probe/base\") == BASE\nblob = ot(\"hash-object\", \"-w\", \"--stdin\", data=RECORD)\nobj(\"read-tree\", BASE)\nobj(\"update-index\", \"--add\", \"--cacheinfo\", \"100644,\" + blob + \",ledger/00000001.json\")\ntree = ot(\"write-tree\")\ncandidate = ot(\"commit-tree\", tree, \"-p\", BASE, \"-m\", \"D4B4 synthetic ledger append record 1\")\nassert candidate == CANDIDATE, \"STOP: reconstructed candidate mismatch\"\nassert ot(\"rev-parse\", candidate + \"^\") == before[LEDGER]\nobj(\"merge-base\", \"--is-ancestor\", BASE, candidate)\nassert ot(\"diff-tree\", \"--no-commit-id\", \"--name-status\", \"-r\", BASE, candidate) == \"A\\tledger/00000001.json\"\nassert obj(\"show\", candidate + \":ledger/00000001.json\").stdout == RECORD\nassert refs() == before, \"STOP: remote changed immediately before push\"\ncommand = \"git push --porcelain \" + REMOTE + \" \" + candidate + \":\" + LEDGER\nprint(\"SANITIZED_COMMAND \" + command, flush=True)\npush = obj(\"push\", \"--porcelain\", REMOTE, candidate + \":\" + LEDGER, check=False)\nstdout, stderr = push.stdout.decode(errors=\"replace\"), push.stderr.decode(errors=\"replace\")\nprint(\"PUSH_EXIT \" + str(push.returncode), flush=True)\nprint(\"SERVER_STDOUT \" + stdout, flush=True)\nprint(\"SERVER_STDERR \" + stderr, flush=True)\nafter = refs()\nresult = {\"mode\": MODE, \"before\": before[LEDGER], \"candidate\": candidate, \"after\": after[LEDGER],\n    \"push_exit\": push.returncode, \"parent\": BASE, \"record_bytes\": len(RECORD), \"record_sha256\": hashlib.sha256(RECORD).hexdigest()}\nif MODE == \"read\":\n    assert push.returncode != 0, \"STOP: read-only push unexpectedly succeeded; write job must not run\"\n    assert after == before, \"STOP: unexpected remote change after denial\"\n    assert \"Write access to repository not granted\" in stderr and \"403\" in stderr, \"STOP: not the expected permission-based denial\"\n    assert not any(marker in stderr for marker in (\"GH013\", \"GH006\", \"protected branch\", \"Authentication failed\", \"401\")), \"STOP: unrelated rejection\"\n    result[\"permission_denial_verified\"] = True\n    print(\"D4B4_RESULT \" + json.dumps(result, sort_keys=True), flush=True)\n    with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"utf-8\") as output:\n        output.write(\"denial_verified=true\\n\")\nelse:\n    assert push.returncode == 0, \"STOP: write push rejected; no retry\"\n    expected[LEDGER] = candidate\n    assert after == expected, \"STOP: unexpected post-write refs\"\n    obj(\"fetch\", \"--no-tags\", REMOTE, LEDGER + \":refs/probe/observed\")\n    assert ot(\"rev-parse\", \"refs/probe/observed\") == candidate\n    obj(\"merge-base\", \"--is-ancestor\", BASE, \"refs/probe/observed\")\n    observed = obj(\"show\", \"refs/probe/observed:ledger/00000001.json\").stdout\n    assert observed == RECORD, \"STOP: exact remote record mismatch\"\n    result.update({\"direct_parent_verified\": True, \"remote_ancestry_verified\": True, \"remote_bytes_verified\": True, \"preserved_refs_verified\": True})\n    print(\"D4B4_RESULT \" + json.dumps(result, sort_keys=True), flush=True)\nPY\n",
          "name": "Independently reconstruct and publish the same FF candidate",
          "shell": "bash"
        }
      ]
    }
  }
}
