{
  "name": "BGZONA promote accepted DEV to PROD",
  "on": {
    "push": {
      "branches": [
        "automation-control"
      ],
      "paths": [
        ".github/workflows/real-prod.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "bgzona-real-prod-promotion",
    "cancel-in-progress": false
  },
  "jobs": {
    "promote": {
      "if": "github.repository_id == '1426765395' && github.ref == 'refs/heads/automation-control' && github.ref_protected && github.actor_id == '252877943' && github.run_attempt == 1 && vars.BGZONA_REAL_ENABLED == 'true'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "env": {
        "GH_TOKEN": "${{ github.token }}",
        "BGZONA_REAL_ENABLED": "${{ vars.BGZONA_REAL_ENABLED }}",
        "BGZONA_CONTROL_PREFLIGHT": "${{ vars.BGZONA_CONTROL_PREFLIGHT }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Bind the completed DEV run",
          "run": "python3 -B tools/rs4m-h1/prod_handoff.py"
        },
        {
          "uses": "actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1",
          "id": "prod-app",
          "with": {
            "client-id": "${{ vars.BGZONA_R_CLIENT_ID }}",
            "private-key": "${{ secrets.BGZONA_R_PRIVATE_KEY }}",
            "owner": "malin-bg",
            "repositories": "bgzona-win",
            "permission-actions": "write"
          }
        },
        {
          "name": "Dispatch only the proved snapshot to PROD",
          "env": {
            "PROD_ACTIONS_TOKEN": "${{ steps.prod-app.outputs.token }}"
          },
          "run": "python3 -B tools/rs4m-h1/prod_handoff.py --dispatch"
        }
      ],
      "environment": "r18h-control"
    }
  }
}
