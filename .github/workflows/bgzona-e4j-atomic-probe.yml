name: BGZONA E4K atomicity probe R1
'on':
  push:
    branches:
      - lab/e4j-atomic-control
permissions: {}
jobs:
  probe:
    if: github.repository_id == '1426765395' && github.actor_id == '252877943' && github.ref == 'refs/heads/lab/e4j-atomic-control' && github.run_number == 4 && github.run_attempt == 1 && github.event.created == false && github.event.deleted == false && github.event.forced == false && github.event.before == '08abaca9b18b6c16b91ea409b7b69ccb6ae8fc81'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Bounded synthetic updateRefs probe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -B - <<'PY'
          import base64
          import concurrent.futures
          import datetime
          import hashlib
          import json
          import os
          import re
          import sys
          import threading
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          
          REPO = "malin-bg/bgzona-github-lab"
          RID = 1426765395
          NODE = "R_kgDOVQq2Uw"
          OWNER = 252877943
          API = "https://api.github.com"
          ROOT = "/repos/" + REPO
          CONTROL = "refs/heads/lab/e4j-atomic-control"
          MAIN = "refs/heads/lab/e4j-atomic-main"
          WITNESS = "refs/bgzona/e4j-atomic-witness"
          WORKFLOW = ".github/workflows/bgzona-e4j-atomic-probe.yml"
          OLD_WORKFLOW = "af0ba9b89a71d1fd29ad36a965198011b513a5d1"
          ZERO = "0" * 40
          HISTORICAL = {"refs/bgzona/witness":"5771a22b759702ccb6d05e8952a683fd309d20b0","refs/heads/lab/d4b4-token-control":"865399ec2575f14f8f571434692d5419305e7834","refs/heads/lab/d4b4-token-ledger":"43a1da60bc204252d21061cd23020427b4e1c030","refs/heads/lab/ledger-ff-probe":"ae2f3294d145845eb0a37253aacc199bed6843a4","refs/heads/lab/protected-ledger-probe":"89f840b035beeec8889a66f784175ae9106d74d2","refs/heads/main":"89f840b035beeec8889a66f784175ae9106d74d2"}
          EXPECTED_RULES = json.loads(r'''[{"id":25467003,"name":"BGZONA-D4B1-protected-ledger-probe","target":"branch","source_type":"Repository","source":"malin-bg/bgzona-github-lab","enforcement":"active","conditions":{"ref_name":{"exclude":[],"include":["refs/heads/lab/protected-ledger-probe"]}},"rules":[{"type":"deletion"},{"type":"non_fast_forward"},{"type":"pull_request","parameters":{"required_approving_review_count":1,"dismiss_stale_reviews_on_push":false,"required_reviewers":[],"require_code_owner_review":false,"require_last_push_approval":false,"required_review_thread_resolution":false,"require_extra_approval_for_unattributed_changes":false,"allowed_merge_methods":["merge","squash","rebase"]}}],"created_at":"2026-10-20T09:49:05.453Z","updated_at":"2026-10-20T09:49:05.499Z","bypass_actors":[]},{"id":25476912,"name":"BGZONA-D4B2-ledger-ff-probe","target":"branch","source_type":"Repository","source":"malin-bg/bgzona-github-lab","enforcement":"active","conditions":{"ref_name":{"exclude":[],"include":["refs/heads/lab/ledger-ff-probe"]}},"rules":[{"type":"deletion"},{"type":"non_fast_forward"}],"created_at":"2026-10-20T13:13:03.114Z","updated_at":"2026-10-20T13:13:03.166Z","bypass_actors":[]}]''')
          TOKEN = os.environ.get("GH_TOKEN", "")
          SHA = os.environ.get("GITHUB_SHA", "")
          R3_CONTROL = "08abaca9b18b6c16b91ea409b7b69ccb6ae8fc81"
          R1_BLOB = "b1b9cad0e1f97597e1880664261ddc962889c9c7"
          R1_TREE = "faa37007f0170bb17ff3617d2e75ee6ee7057d15"
          R1_COMMITS = {"main-0":"3a4b4eee4349f742f9159e69641798d08c9d9f32","witness-0":"0b42ba3386a761c2e35a5095c04ff42f9fe6265d","main-1":"83dc2c5f30a6b49d5e520f7f27f6a43ef58c7c81","witness-1":"32d3c6105acb74341526fb64e7f91661d0aa201a","main-2a":"eeb50c0c6e26a6ec6af142dfee6bef5a803564af","witness-2a":"84c7e3bec1f026c83381b4ea2e0779df4b5cbd8e","main-2b":"1a85b7ee62149a6d380cf9a31f63659608d2f205","witness-2b":"4347c447eb2ca43df6db276431ca8477158a8e22"}
          START = time.monotonic()
          LOCK = threading.Lock()
          COUNTS = {"updateRefs": 0, "objects": 0, "payload_bytes": 0, "reused_objects": 0}
          OBJECTS = {}
          BASE_POLICY = None
          BASE_BRANCHES = None
          EXPECTED_BRANCHES = {"lab/d4b4-token-control":False,"lab/d4b4-token-ledger":False,"lab/e4j-atomic-control":False,"lab/e4j-atomic-main":False,"lab/ledger-ff-probe":True,"lab/protected-ledger-probe":True,"main":False}
          HTTP_HEADERS = ("x-github-request-id", "x-ratelimit-remaining", "x-ratelimit-reset", "retry-after")
          
          class Stop(RuntimeError):
              pass
          
          def need(ok, reason):
              if not ok:
                  raise Stop(reason)
          
          def emit(kind, **data):
              line = json.dumps({"kind": kind, **data}, sort_keys=True, separators=(",", ":"))
              if TOKEN:
                  line = line.replace(TOKEN, "[REDACTED]")
              with LOCK:
                  print("E4K " + line, flush=True)
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          def http(path, data=None):
              need(time.monotonic() - START < 480, "BOUNDED_TIME_STOP")
              need(path == "/graphql" or path.startswith(ROOT + "/") or path == ROOT, "API_SCOPE")
              if data is not None:
                  need(path == "/graphql" or path in
                       (ROOT + "/git/commits",), "WRITE_ENDPOINT")
              headers = {"Authorization": "Bearer " + TOKEN, "Accept": "application/vnd.github+json",
                         "User-Agent": "BGZONA-E4K-R1", "X-GitHub-Api-Version": "2022-11-28"}
              body = None if data is None else json.dumps(data).encode()
              if body is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(API + path, data=body, headers=headers)
              # No retry, redirect, credential helper, external action or shell execution.
              opener = urllib.request.build_opener(NoRedirect)
              try:
                  with opener.open(req, timeout=25) as response:
                      raw = response.read(2_000_001)
                      status, h = response.status, response.headers
              except urllib.error.HTTPError as error:
                  raw, status, h = error.read(2_000_001), error.code, error.headers
              except (OSError, TimeoutError) as error:
                  emit("NETWORK_UNKNOWN", path=path, method=req.get_method(), error_type=type(error).__name__)
                  raise Stop("UNKNOWN_HTTP_OUTCOME_NO_RETRY") from None
              need(len(raw) <= 2_000_000, "RESPONSE_LIMIT")
              try:
                  result = json.loads(raw)
              except (ValueError, UnicodeError):
                  raise Stop("NON_JSON_RESPONSE") from None
              metadata = {k: h.get(k) for k in HTTP_HEADERS if h.get(k) is not None}
              if not 200 <= status < 300:
                  emit("HTTP_STOP", path=path, status=status, response=result, headers=metadata)
                  raise Stop("HTTP_REFUSAL_OR_ERROR_NO_RETRY")
              return result, {"status": status, **metadata}
          
          def get(suffix):
              return http(ROOT + suffix)[0]
          
          def oid(value):
              need(isinstance(value, str) and re.fullmatch("[0-9a-f]{40}", value), "INVALID_OID")
              return value
          
          def git_hash(kind, raw):
              return hashlib.sha1(kind.encode() + b" " + str(len(raw)).encode() + b"\0" + raw).hexdigest()
          
          def refs():
              rows = get("/git/matching-refs/")
              need(isinstance(rows, list) and len(rows) < 100, "REF_INVENTORY_LIMIT")
              result = {}
              for row in rows:
                  need(row["object"]["type"] == "commit" and row["ref"] not in result, "REF_TYPE_OR_DUPLICATE")
                  result[row["ref"]] = oid(row["object"]["sha"])
              return result
          
          def check_refs(pair, label):
              actual = refs()
              expected = dict(HISTORICAL, **{CONTROL: SHA})
              if pair is not None:
                  expected.update(dict(zip((MAIN, WITNESS), pair)))
              emit("REF_READBACK", label=label, actual=actual, expected=expected)
              need(actual == expected, "UNEXPECTED_REMOTE_REF_STATE")
              return actual
          
          def rule_core(rule):
              keys = ("id", "name", "target", "source_type", "source", "enforcement",
                      "conditions", "rules", "created_at", "updated_at")
              return {**{k: rule[k] for k in keys}, "bypass_actors": rule.get("bypass_actors", [])}
          
          def policy():
              listed = get("/rulesets?includes_parents=true&per_page=100")
              need(sorted(r["id"] for r in listed) == [25467003, 25476912], "RULESET_INVENTORY_CHANGED")
              details = sorted((rule_core(get("/rulesets/" + str(r["id"]))) for r in listed), key=lambda r: r["id"])
              need(details == EXPECTED_RULES, "HISTORICAL_RULESETS_CHANGED")
              for branch in ("lab/e4j-atomic-control", "lab/e4j-atomic-main"):
                  need(get("/rules/branches/" + urllib.parse.quote(branch, safe="")) == [], "UNEXPECTED_TARGET_RULE")
              branches = get("/branches?per_page=100")
              need(len(branches) < 100, "BRANCH_INVENTORY_LIMIT")
              protected = {b["name"]: b["protected"] for b in branches}
              need(not protected.get("lab/e4j-atomic-control") and
                   not protected.get("lab/e4j-atomic-main", False), "TARGET_PROTECTED")
              need(protected == EXPECTED_BRANCHES, "EXPECTED_BRANCH_PROTECTION_CHANGED")
              return details, protected
          
          def preservation():
              rules, branches = policy()
              need(rules == BASE_POLICY, "POLICY_CHANGED")
              need(branches == BASE_BRANCHES, "OTHER_BRANCH_PROTECTION_CHANGED")
              blob = get("/git/blobs/" + OLD_WORKFLOW)
              raw = base64.b64decode(blob["content"])
              need(git_hash("blob", raw) == OLD_WORKFLOW, "HISTORICAL_WORKFLOW_CHANGED")
              emit("PRESERVATION", rules=rules, branches=branches,
                   historical_workflow_blob=OLD_WORKFLOW,
                   historical_workflow_sha256=hashlib.sha256(raw).hexdigest())
          
          def reuse_object(kind, expected, payload, raw):
              need(kind in ("blob", "tree", "commit"), "OBJECT_KIND")
              oid(expected)
              candidates = [raw, raw[:-1]] if kind == "commit" and raw.endswith(b"\n") else [raw]
              matched = [candidate for candidate in candidates if git_hash(kind, candidate) == expected]
              need(len(matched) == 1 and expected not in OBJECTS, "R1_OBJECT_PIN_MISMATCH")
              remote = get("/git/" + {"blob":"blobs","tree":"trees","commit":"commits"}[kind] + "/" + expected)
              need(remote["sha"] == expected, "R1_OBJECT_UNAVAILABLE_OR_CHANGED")
              if kind == "blob":
                  need(base64.b64decode(remote["content"]) == raw, "R1_BLOB_BYTES")
              elif kind == "tree":
                  entries = [{k: entry[k] for k in ("path","mode","type","sha")} for entry in remote["tree"]]
                  need(not remote["truncated"] and entries == payload["tree"], "R1_TREE_ENTRIES")
              else:
                  need(remote["tree"]["sha"] == payload["tree"] and
                       [p["sha"] for p in remote["parents"]] == payload["parents"] and
                       remote["message"] in (payload["message"], payload["message"][:-1]), "R1_COMMIT_FIELDS")
                  need(remote["author"] == payload["author"] and remote["committer"] == payload["committer"],
                       "R1_COMMIT_PERSON")
              need(COUNTS["reused_objects"] < 10, "R1_REUSE_LIMIT")
              COUNTS["reused_objects"] += 1
              OBJECTS[expected] = (kind, matched[0])
              emit("OBJECT_REUSED", type=kind, sha=expected, bytes=len(matched[0]),
                   sha256=hashlib.sha256(matched[0]).hexdigest())
              return expected

          def create_object(kind, payload, raw):
              need(kind in ("blob", "tree", "commit"), "OBJECT_KIND")
              need(kind == "commit" and COUNTS["objects"] < 1 and 2180 + COUNTS["payload_bytes"] + len(raw) <= 32768, "OBJECT_BUDGET")
              # Count attempts, not successes: a lost response never authorizes another POST.
              COUNTS["objects"] += 1
              COUNTS["payload_bytes"] += len(raw)
              result, headers = http(ROOT + "/git/" + {"blob":"blobs","tree":"trees","commit":"commits"}[kind], payload)
              sha = oid(result["sha"])
              # GitHub may normalize the final commit-message LF; allow only these exact encodings.
              candidates = [raw, raw[:-1]] if kind == "commit" and raw.endswith(b"\n") else [raw]
              matched = [candidate for candidate in candidates if sha == git_hash(kind, candidate)]
              need(len(matched) == 1, "CREATED_OBJECT_HASH_MISMATCH")
              raw = matched[0]
              OBJECTS[sha] = (kind, raw)
              emit("OBJECT_CREATED", type=kind, sha=sha, bytes=len(raw),
                   sha256=hashlib.sha256(raw).hexdigest(), http=headers)
              return sha
          
          PERSON = {"name": "BGZONA Synthetic Lab", "email": "bgzona-lab@example.invalid", "date": "2026-10-22T00:00:00Z"}
          
          def commit(label, tree, parent=None):
              parents = [] if parent is None else [oid(parent)]
              message = "BGZONA-E4K synthetic " + label + "\n"
              epoch = int(datetime.datetime.fromisoformat(PERSON["date"].replace("Z", "+00:00")).timestamp())
              who = PERSON["name"] + " <" + PERSON["email"] + "> " + str(epoch) + " +0000"
              raw = ("tree " + tree + "\n" + "".join("parent " + p + "\n" for p in parents)
                     + "author " + who + "\ncommitter " + who + "\n\n" + message).encode()
              payload = {"message": message, "tree": tree, "parents": parents,
                         "author": PERSON, "committer": PERSON}
              if label in R1_COMMITS:
                  return reuse_object("commit", R1_COMMITS[label], payload, raw)
              need(label == "witness-3" and tree == R1_TREE and
                   parent in (R1_COMMITS["witness-2a"], R1_COMMITS["witness-2b"]),
                   "ONLY_ONE_WINNING_WITNESS_CHILD")
              sha = create_object("commit", payload, raw)
              remote = get("/git/commits/" + sha)
              need(remote["sha"] == sha and remote["tree"]["sha"] == tree and
                   [p["sha"] for p in remote["parents"]] == parents and remote["message"] in (message, message[:-1]), "COMMIT_READBACK")
              return sha
          
          MUTATION = "mutation($input:UpdateRefsInput!){updateRefs(input:$input){clientMutationId}}"
          
          def ancestor(old, new):
              todo, seen = [oid(new)], set()
              oid(old)
              while todo:
                  value = todo.pop()
                  need(value in OBJECTS and OBJECTS[value][0] == "commit", "ANCESTRY_OBJECT_NOT_VERIFIED")
                  if value == old:
                      return True
                  if value in seen:
                      continue
                  seen.add(value)
                  need(len(seen) <= 9, "ANCESTRY_LIMIT")
                  header = OBJECTS[value][1].split(b"\n\n", 1)[0]
                  todo.extend(oid(line[7:].decode()) for line in header.splitlines() if line.startswith(b"parent "))
              return False

          def ancestry_proof(label, current, before, after, mode):
              rows = []
              for index, name in enumerate((MAIN, WITNESS)):
                  actual, supplied, target = current[index], before[index], after[index]
                  root = R1_COMMITS[("main-0", "witness-0")[index]]
                  need(all(ancestor(root, value) for value in (actual, supplied, target)), "REF_LINEAGE")
                  rows.append({"name":name, "actual":actual, "beforeOid":supplied, "afterOid":target,
                               "before_matches_actual":supplied == actual, "before_differs_after":supplied != target,
                               "before_ancestor_after":ancestor(supplied,target),
                               "actual_ancestor_after":ancestor(actual,target)})
              if mode.startswith("stale-"):
                  bad = 0 if mode == "stale-main" else 1
                  need(not rows[bad]["before_matches_actual"] and rows[bad]["before_differs_after"] and
                       all(r["before_ancestor_after"] and r["actual_ancestor_after"] for r in rows) and
                       rows[1-bad]["before_matches_actual"] and all(current[i] != after[i] for i in (0,1)),
                       "STALE_NOT_ISOLATED")
              elif mode.startswith("nonff-"):
                  bad = 0 if mode == "nonff-main" else 1
                  need(before == current and not rows[bad]["actual_ancestor_after"] and
                       ancestor(after[bad],current[bad]) and current[bad] != after[bad] and
                       rows[1-bad]["actual_ancestor_after"] and current[1-bad] != after[1-bad],
                       "NONFF_NOT_ISOLATED")
              elif mode == "noop":
                  need(before == current and after[0] == current[0] and after[1] != current[1] and
                       rows[1]["actual_ancestor_after"], "NOOP_NOT_ISOLATED")
              else:
                  need(mode == "ff" and before == current and
                       all(rows[i]["actual_ancestor_after"] and current[i] != after[i] for i in (0,1)),
                       "PAIR_NOT_STRICT_FF")
              emit("ANCESTRY_PROOF", label=label, mode=mode, rows=rows)

          def update(label, before, after, barrier=None):
              need(len(before) == len(after) == 2, "PAIR_REQUIRED")
              for value in before + after:
                  oid(value)
              need(all(value != ZERO and value in OBJECTS and OBJECTS[value][0] == "commit" for value in after),
                   "ONLY_VERIFIED_SYNTHETIC_TARGETS")
              need(all(value != ZERO and value in OBJECTS and OBJECTS[value][0] == "commit" for value in before),
                   "R2_EXISTING_SYNTHETIC_BASES_ONLY")
              need(all(ancestor(R1_COMMITS[root], value) for root, values in
                       zip(("main-0","witness-0"), zip(before,after)) for value in values), "REF_LINEAGE")
              entries = [{"name": name, "beforeOid": old, "afterOid": new, "force": False}
                         for name, old, new in zip((MAIN, WITNESS), before, after)]
              need(set(e["name"] for e in entries) == {MAIN, WITNESS} and
                   not ({MAIN, WITNESS} & set(HISTORICAL)), "REF_ALLOWLIST")
              with LOCK:
                  need(COUNTS["updateRefs"] < 8, "MUTATION_BUDGET")
                  COUNTS["updateRefs"] += 1
              request = {"query": MUTATION, "variables": {"input": {
                  "repositoryId": NODE, "clientMutationId": label, "refUpdates": entries}}}
              emit("GRAPHQL_REQUEST", label=label, request=request)
              if barrier is not None:
                  barrier.wait(timeout=10)
              response, headers = http("/graphql", request)
              emit("GRAPHQL_RESPONSE", label=label, response=response, http=headers)
              return response
          
          def success(response, label):
              need(not response.get("errors") and response.get("data", {}).get("updateRefs") ==
                   {"clientMutationId": label}, "UNEXPECTED_MUTATION_FAILURE")
          
          def rejection(response, reason):
              need(isinstance(response, dict), "UNRESOLVED_MALFORMED_GRAPHQL")
              errors, data = response.get("errors"), response.get("data")
              need(isinstance(errors, list) and errors and
                   (data is None or isinstance(data, dict) and data.get("updateRefs") is None),
                   "UNRESOLVED_EXPECTED_REJECTION_MISSING_OR_CONTRADICTORY")
              need(all(isinstance(e, dict) and e.get("type") == "UNPROCESSABLE" and
                       isinstance(e.get("message"), str) and e["message"].strip() and
                       e.get("path", ["updateRefs"]) == ["updateRefs"] for e in errors),
                   "UNRESOLVED_UNCLASSIFIED_GRAPHQL_ERROR")
              messages = " ".join(e["message"] for e in errors).lower()
              need(not re.search(r"permission|forbidden|not accessible|rate.limit|quota|billing|policy|ruleset|protected branch",
                                 messages), "UNRESOLVED_UNRELATED_PROVIDER_REFUSAL")
              need(not re.search(r"something went wrong|internal.{0,12}error|unknown|unexpected.{0,12}error|try again",
                                 messages), "UNRESOLVED_GENERIC_PROVIDER_ERROR")
              stale = bool(re.search(r"beforeoid|does not (?:point|match)|mismatch|is at|stale|expected.{0,120}(?:oid|ref|value)|cannot lock ref",
                                     messages))
              nonff = bool(re.search(r"fast[- ]forward", messages))
              explicit = stale or nonff or bool(re.search(r"(?:ref|reference|updaterefs).{0,80}(?:reject|invalid|fail)|(?:reject|fail).{0,80}(?:ref|reference)", messages))
              need(explicit and not (stale and nonff), "UNRESOLVED_UNKNOWN_OR_CONTRADICTORY_DIAGNOSTIC")
              emit("REJECTION", classification="B", pair_unchanged=True, diagnostic=messages)
              if reason.startswith("stale-"):
                  need(not nonff, "UNRESOLVED_CONTRADICTORY_STALE_DIAGNOSTIC")
                  classification = "D"
                  basis = "isolated-beforeOid; typed explicit refusal; unchanged pair"
                  certainty = "diagnostic supports stale" if stale else "stale supported by isolation; provider cause not named"
              elif reason.startswith("nonff-"):
                  need(nonff and not stale, "UNRESOLVED_NONFF_CAUSE_NOT_CONFIRMED")
                  classification, basis, certainty = "C", "isolated rollback plus nonFF diagnostic", "confirmed nonFF refusal"
              else:
                  need(reason == "race", "UNRESOLVED_REJECTION_CONTEXT")
                  classification, basis, certainty = "B", "one winner and whole winning pair readback", "race loser cause not independently isolated"
              return {"classification":classification, "basis":basis, "cause_evidence":certainty}
          
          def case(label, current, before, after, mode):
              check_refs(current, label + "-before")
              ancestry_proof(label, current, before, after, mode)
              response = update(label, before, after)
              negative = mode.startswith(("stale-", "nonff-"))
              # Readback precedes response classification; never resend a mutation.
              observed = check_refs(current if negative else after, label + "-after")
              preservation()
              if negative:
                  classification = rejection(response, mode)
              else:
                  success(response, label)
                  classification = {"classification":"A", "basis":"exact success plus verified pair"}
              emit("CASE_PASS", label=label, result=classification, observed=observed,
                   reconciliation=("readback-before-response-classification" if mode == "noop" else None))
              return current if negative else after
          
          def run():
              global BASE_POLICY, BASE_BRANCHES
              need(TOKEN and os.environ.get("GITHUB_REPOSITORY") == REPO and
                   os.environ.get("GITHUB_REPOSITORY_ID") == str(RID) and
                   os.environ.get("GITHUB_REPOSITORY_OWNER_ID") == str(OWNER), "RUNTIME_REPOSITORY")
              need(os.environ.get("GITHUB_EVENT_NAME") == "push" and os.environ.get("GITHUB_REF") == CONTROL and
                   os.environ.get("GITHUB_ACTOR_ID") == str(OWNER) and os.environ.get("GITHUB_RUN_ATTEMPT") == "1" and
                   os.environ.get("GITHUB_RUN_NUMBER") == "4",
                   "ONE_OWNER_PUSH_ATTEMPT_ONLY")
              need(os.environ.get("RUNNER_ENVIRONMENT") == "github-hosted" and
                   os.environ.get("RUNNER_OS") == "Linux", "STANDARD_HOSTED_RUNNER_REQUIRED")
              need(os.environ.get("GITHUB_WORKFLOW_SHA") == SHA and
                   os.environ.get("GITHUB_WORKFLOW_REF") == REPO + "/" + WORKFLOW + "@" + CONTROL,
                   "WORKFLOW_SOURCE_MISMATCH")
              event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
              need(event.get("created") is False and event.get("deleted") is False and
                   event.get("forced") is False and event.get("before") == R3_CONTROL and
                   event.get("after") == SHA, "ONE_REVIEWED_R4_CONTROL_PUSH_ONLY")
              metadata = get("")
              need(metadata["id"] == RID and metadata["node_id"] == NODE and metadata["full_name"] == REPO and
                   metadata["owner"]["id"] == OWNER and metadata["visibility"] == "public" and
                   metadata["default_branch"] == "main" and metadata["archived"] is False, "LIVE_IDENTITY")
              source = get("/commits/" + oid(SHA))
              need([p["sha"] for p in source["parents"]] == [R3_CONTROL] and
                   len(source["files"]) == 1 and source["files"][0]["filename"] == WORKFLOW and
                   source["files"][0]["status"] == "modified", "ONLY_REVIEWED_WORKFLOW_COMMIT")
              code = get("/git/blobs/" + source["files"][0]["sha"])
              code_bytes = base64.b64decode(code["content"])
              need(git_hash("blob", code_bytes) == source["files"][0]["sha"], "SOURCE_BLOB")
              emit("RUNTIME", source_sha=SHA, source_tree=source["commit"]["tree"]["sha"],
                   workflow_sha256=hashlib.sha256(code_bytes).hexdigest(),
                   run_id=os.environ.get("GITHUB_RUN_ID"), attempt=1, actor_id=OWNER,
                   runner_environment=os.environ["RUNNER_ENVIRONMENT"], python=sys.version,
                   limits={"r4_mutations":8,"cumulative_mutations":11,"new_objects":1,
                           "total_data_objects":11,"payload_bytes":32768,"job_minutes":10})
              check_refs((R1_COMMITS["main-0"], R1_COMMITS["witness-0"]), "R4-pinned-existing-seed")
              BASE_POLICY, BASE_BRANCHES = policy()
              preservation()
              identity, _ = http("/graphql", {"query":
                  "query($id:ID!){node(id:$id){... on Repository{id databaseId nameWithOwner isPrivate}}}",
                  "variables":{"id":NODE}})
              need(not identity.get("errors") and identity.get("data", {}).get("node") ==
                   {"id":NODE,"databaseId":RID,"nameWithOwner":REPO,"isPrivate":False}, "GRAPHQL_IDENTITY")
              payload = b"BGZONA-E4K SYNTHETIC TEXT ONLY\n"
              blob = reuse_object("blob", R1_BLOB, {"content":payload.decode(), "encoding":"utf-8"}, payload)
              tree_raw = b"100644 probe.txt\0" + bytes.fromhex(blob)
              tree = reuse_object("tree", R1_TREE, {"tree":[{"path":"probe.txt","mode":"100644","type":"blob","sha":blob}]}, tree_raw)
              pair0 = (commit("main-0", tree), commit("witness-0", tree))
              pair1 = (commit("main-1", tree, pair0[0]), commit("witness-1", tree, pair0[1]))
              pair_a = (commit("main-2a", tree, pair1[0]), commit("witness-2a", tree, pair1[1]))
              pair_b = (commit("main-2b", tree, pair1[0]), commit("witness-2b", tree, pair1[1]))
              current = pair0  # Existing R1 refs; no initialization or ref creation.
              need(COUNTS["updateRefs"] == 0, "FIRST_MUTATION_MUST_BE_VALID_FF")
              current = case("01-ff-pair", current, current, pair1, "ff")
              case("02-stale-main", current, (pair0[0],pair1[1]), pair_a, "stale-main")
              case("03-stale-witness", current, (pair1[0],pair0[1]), pair_a, "stale-witness")
              case("04-nonff-main", current, current, (pair0[0],pair_a[1]), "nonff-main")
              case("05-nonff-witness", current, current, (pair_a[0],pair0[1]), "nonff-witness")
              check_refs(current, "06-race-before")
              ancestry_proof("06-race-a", current, current, pair_a, "ff")
              ancestry_proof("06-race-b", current, current, pair_b, "ff")
              barrier = threading.Barrier(2)
              with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
                  tasks = [pool.submit(update, "06-race-"+name, current, pair, barrier)
                           for name,pair in (("a",pair_a),("b",pair_b))]
                  responses = [task.result() for task in tasks]
              need(all(isinstance(r, dict) for r in responses), "UNRESOLVED_MALFORMED_RACE_RESPONSE")
              winners = [i for i,r in enumerate(responses) if not r.get("errors")]
              need(len(winners) == 1, "UNRESOLVED_RACE_EXACTLY_ONE_WINNER_REQUIRED")
              winner = winners[0]
              current = (pair_a, pair_b)[winner]
              check_refs(current, "06-race-after-both-completed")
              preservation()
              success(responses[winner], "06-race-"+("a","b")[winner])
              loser = rejection(responses[1-winner], "race")
              emit("CASE_PASS", label="06-concurrent-advancement", winner=("a","b")[winner],
                   pair=current, loser=loser)
              w3 = commit("witness-3", tree, current[1])
              # Combine main no-op / witness FF with readback-before-response-use.
              # This is deliberate response-use ordering, not a real provider outage.
              current = case("07-main-noop-reconcile", current, current, (current[0],w3), "noop")
              preservation()
              check_refs(current, "final")
              need(COUNTS["updateRefs"] == 8 and COUNTS["objects"] == 1 and
                   COUNTS["reused_objects"] == 10 and 2180 + COUNTS["payload_bytes"] <= 32768,
                   "FINAL_BUDGET_ACCOUNTING")
              emit("RESULT", status="PASS", r4_cases=7, r1_init_reused=True,
                   cumulative_mutations=3+COUNTS["updateRefs"], counters=COUNTS, final_pair=current,
                   duration_seconds=round(time.monotonic()-START,3), app_s_verified=False,
                   cross_repository_atomicity=False, production_ready=False, routine_intake="NO-GO")
          
          if __name__ == "__main__":
              try:
                  run()
              except Exception as error:
                  emit("RESULT", status=("UNRESOLVED" if str(error).startswith("UNRESOLVED_") else "STOP"),
                       reason=str(error) if isinstance(error,Stop) else type(error).__name__,
                       counters=COUNTS, duration_seconds=round(time.monotonic()-START,3))
                  # Read-only evidence after any unexpected result. Never repair/retry a write.
                  try:
                      state = refs()
                      emit("STOP_REF_STATE", refs=state,
                           historical_preserved=all(state.get(k)==v for k,v in HISTORICAL.items()),
                           control_preserved=state.get(CONTROL)==SHA,
                           unexpected_refs=sorted(set(state)-set(HISTORICAL)-{CONTROL,MAIN,WITNESS}))
                      if BASE_POLICY is not None:
                          preservation()
                  except Exception as read_error:
                      emit("STOP_REF_STATE_UNKNOWN", error_type=type(read_error).__name__)
                  raise SystemExit(1)
          PY
